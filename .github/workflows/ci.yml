name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings in nullable code fail the build)
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/MarketingStudio.UnitTests --no-build -c Release --logger trx --collect "XPlat Code Coverage"

      - name: Integration tests (MongoDB via Testcontainers; includes tenant isolation suite)
        run: dotnet test tests/MarketingStudio.IntegrationTests --no-build -c Release --logger trx

      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q -E "Critical|High" vulnerable.txt; then echo "Vulnerable packages found"; exit 1; fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: "**/TestResults/**"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Runs the gitleaks CLI directly (pinned) over the full history. The gitleaks GitHub Action
      # fails on a repository's first push because there is no "before" commit to diff against.
      - name: Scan git history for secrets
        env:
          GITLEAKS_VERSION: 8.24.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (production)
        run: npx ng build
      - name: Unit tests (Vitest)
        run: npx ng test --watch=false
      - name: Fail on vulnerable packages
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # Real stack: API container (built from the Dockerfile) + MongoDB + Mailpit, portal dev server,
    # Cypress journeys with axe accessibility checks. Also proves the API image starts and is healthy.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-test, portal]
    steps:
      - uses: actions/checkout@v5

      - name: Start API, MongoDB and Mailpit
        run: |
          docker compose up -d --build mongodb mailpit api
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready)" = "200" ] && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Start portal
        working-directory: portal
        run: |
          npm ci --no-audit --no-fund
          API_URL=http://localhost:8080 nohup npx ng serve --port 4200 > ng-serve.log 2>&1 &
          for i in $(seq 1 90); do
            curl -s -o /dev/null http://localhost:4200/login && exit 0
            sleep 2
          done
          cat ng-serve.log
          exit 1

      - name: Cypress journeys + axe
        run: >
          docker run --rm --network host
          -v "${{ github.workspace }}/portal/e2e:/src:ro"
          -e CYPRESS_BASE_URL=http://localhost:4200
          -e CYPRESS_MAILPIT_URL=http://localhost:8025
          -e CYPRESS_INSTALL_BINARY=0
          --entrypoint sh cypress/included:15.21.2
          -c 'mkdir -p /work && cp -r /src/. /work && cd /work && npm ci --no-audit --no-fund && cypress run --browser chrome'

      - name: API logs on failure
        if: failure()
        run: docker compose logs api

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f src/MarketingStudio.Api/Dockerfile -t marketingstudio-api:${{ github.sha }} .
