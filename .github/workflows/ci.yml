name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings in nullable code fail the build)
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/MarketingStudio.UnitTests --no-build -c Release --logger trx --collect "XPlat Code Coverage"

      - name: Integration tests (MongoDB via Testcontainers; includes tenant isolation suite)
        run: dotnet test tests/MarketingStudio.IntegrationTests --no-build -c Release --logger trx

      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q -E "Critical|High" vulnerable.txt; then echo "Vulnerable packages found"; exit 1; fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: "**/TestResults/**"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Runs the gitleaks CLI directly (pinned) over the full history. The gitleaks GitHub Action
      # fails on a repository's first push because there is no "before" commit to diff against.
      - name: Scan git history for secrets
        env:
          GITLEAKS_VERSION: 8.24.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f src/MarketingStudio.Api/Dockerfile -t marketingstudio-api:${{ github.sha }} .
